# Free security scanning: SAST (CodeQL), secrets (gitleaks), dependency vulns
# (govulncheck, pnpm audit), and filesystem/Dockerfile scan (Trivy).
# CodeQL uploads results to the Security tab, which is free on public repos;
# on a private repo without GitHub Advanced Security that job will fail and can
# be ignored (it does not block the others).
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly, catches newly published CVEs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Only Go can autobuild; JS/TS and Actions are source-only (none).
        include:
          - { language: go, build-mode: autobuild }
          - { language: javascript-typescript, build-mode: none }
          - { language: actions, build-mode: none }
    steps:
      - uses: actions/checkout@v7
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan full history
      # CLI via the official image: the gitleaks GitHub Action needs a paid
      # license for organization-owned repos, the CLI does not.
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1

  govulncheck:
    name: Go vulns (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  pnpm-audit:
    name: JS vulns (pnpm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Production deps only; dev-tool advisories rarely reach users.
      - run: pnpm audit --prod --audit-level high

  trivy:
    name: Filesystem + Dockerfiles (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
