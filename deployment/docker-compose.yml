name: restaurants

# Infra for local development. All state is bind-mounted under ./data/.
# The Go API and Next.js run on the host for now (see root Makefile).

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - ./data/postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ./data/garage/meta:/var/lib/garage/meta
      - ./data/garage/data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900" # S3 API
      - "127.0.0.1:3902:3902" # public web endpoint (images)
    networks:
      default:
        aliases:
          # Garage's web endpoint picks the bucket from the Host header
          # (<bucket>.<root_domain>), so containers reach it by this name.
          - restaurant-images.web.garage.localhost
