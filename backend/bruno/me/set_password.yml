info:
  name: "/me/password"
  type: http
  seq: 3

http:
  method: PUT
  url: "{{base_url}}/me/password"
  body:
    type: json
    data: |-
      {
        "current_password": "{{password}}",
        "new_password": "{{password}}"
      }
  auth: inherit

docs:
  content: |-
    Sets the same password again, so the collection keeps working. `current_password` is ignored for Google-only accounts.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
