info:
  name: "/restaurants (search)"
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/restaurants"
  params:
    - name: q
      value: "thai"
      type: query
    - name: sort
      value: "most_reviewed"
      type: query
  auth: inherit

docs:
  content: |-
    `q` matches name or cuisine, case-insensitive.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
