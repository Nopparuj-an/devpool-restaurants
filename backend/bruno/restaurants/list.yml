info:
  name: "/restaurants"
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/restaurants"
  params:
    - name: sort
      value: "top_rated"
      type: query
    - name: order
      value: "desc"
      type: query
    - name: limit
      value: "24"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

docs:
  content: |-
    `sort`: top_rated (Bayesian, ADR-0004), most_reviewed, newest. `order`: desc (default) or asc. Returns `{restaurants, total}`.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
