info:
  name: "/auth/signup"
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/auth/signup"
  body:
    type: json
    data: |-
      {
        "email": "{{signup_email}}",
        "password": "password123",
        "display_name": "Bruno Tester"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("signup_email", `bruno${Date.now()}@example.com`);

docs:
  content: |-
    Uses a fresh email each time and logs in as the new account.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
