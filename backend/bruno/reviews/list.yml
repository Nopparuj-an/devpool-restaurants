info:
  name: "/restaurants/:id/reviews"
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/restaurants/{{review_restaurant_id}}/reviews"
  params:
    - name: limit
      value: "20"
      type: query
    - name: offset
      value: "0"
      type: query
    - name: sort
      value: newest
      type: query
    - name: rating
      value: "5"
      type: query
  auth: inherit

docs:
  content: |-
    `sort`: newest (default) or oldest, by last update. `rating` 1 to 5 shows that star rating only; leave it out for all. `total` counts the matches; `rating_counts` has every star level (R-REVIEW-8).
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
